name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

      # Check the published package actually holds what it advertises
      - run: pnpm pack --pack-destination /tmp

  # The documentation site is a standalone project: build it the way Pages does
  # and crawl the static output, so a broken internal link fails the pull
  # request rather than the reader.
  website-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          DOCS_BASE: /react-resource-view/
      - run: pnpm run check-links
        env:
          DOCS_BASE: /react-resource-view/

  # The job above builds the site the way Pages does, on the library npm serves
  # — so it says nothing about the change in this pull request. This one builds
  # the same site against the working tree, which is the only place a change
  # under src/ meets the site before a release does.
  #
  # It uses RRV_SOURCE=dist rather than src: the site then runs on the artifact
  # tsdown produces, so a packaging mistake — an entry missing from the exports
  # map, a dependency that should have been externalised — fails here too, and
  # not at a reader's install.
  website-against-worktree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The library first: the site reads dist/, so it has to exist.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - run: pnpm install --frozen-lockfile
        working-directory: website

      # Does the site still compile against the types this build emitted?
      - run: pnpm run typecheck:dist
        working-directory: website

      # And does it still render? The prerender mounts every page, so a
      # component the change broke fails the build rather than the deployment.
      - run: pnpm run build
        working-directory: website
        env:
          RRV_SOURCE: dist
          DOCS_BASE: /react-resource-view/
      - run: pnpm run check-links
        working-directory: website
        env:
          DOCS_BASE: /react-resource-view/
