name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The documentation site is a standalone project with its own lockfile; it
    # consumes both packages from npm rather than from this working tree.
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # The playground is rendered in the browser only, out of the prerender's
      # reach: a playground that shows its error screen must not reach Pages.
      - run: pnpm run test:playground

      # Pages serves the site from /<repository>/, not from the domain root, and
      # has no server to render on request — so the build prerenders every route
      # to static HTML behind that prefix.
      #
      # The prerender crawls the site over HTTP, through a preview server it
      # starts in the same process. When one of those local requests does not go
      # through, the build dies on an unhandled rejection — a raw `fetch failed`
      # stack, no page at fault, and the same commit builds fine when it is run
      # again. A second attempt keeps that hiccup from holding the deployment
      # back; a page that really fails to render fails both attempts.
      - name: Build (retried once)
        run: pnpm run build || (echo "::warning::prerender failed, building again" && pnpm run build)
        env:
          DOCS_BASE: /react-resource-view/

      # A link that leads to a 404 on Pages must not reach Pages.
      - run: pnpm run check-links
        env:
          DOCS_BASE: /react-resource-view/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
